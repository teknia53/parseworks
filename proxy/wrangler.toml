name = "parseworks-proxy"
main = "src/index.js"
compatibility_date = "2025-01-01"

routes = [
  { pattern = "billmounce.com/pw*", zone_name = "billmounce.com" },
  { pattern = "www.billmounce.com/pw*", zone_name = "billmounce.com" },
  # Legacy path, apex only. Not routed on www, where /parseworks is a Drupal info node.
  { pattern = "billmounce.com/parseworks*", zone_name = "billmounce.com" }
]

[vars]
PAGES_URL = "https://parseworks.pages.dev"

# Edits from /pw/edit, as a patch layer over the word list in the app.
[[d1_databases]]
binding = "EDITS"
database_name = "parseworks-edits"
database_id = "69461230-2501-46ad-b32d-07ba93b01701"
