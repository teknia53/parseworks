name = "parseworks-proxy"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Since the new billmounce.com launched (10 Oct 2026) the site serves its own
# copy of ParseWorks at /pw/; this Worker answers only /pw/api (corrections
# and audio, D1 parseworks-edits). The editor /pw/edit/ is proxied to Pages
# by the site's _redirects.
routes = [
  { pattern = "billmounce.com/pw/api*", zone_name = "billmounce.com" },
  { pattern = "www.billmounce.com/pw/api*", zone_name = "billmounce.com" }
]

[vars]
PAGES_URL = "https://parseworks.pages.dev"

# Edits from /pw/edit, as a patch layer over the word list in the app.
[[d1_databases]]
binding = "EDITS"
database_name = "parseworks-edits"
database_id = "69461230-2501-46ad-b32d-07ba93b01701"
